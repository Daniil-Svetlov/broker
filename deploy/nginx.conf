# OrionTrade — обратный прокси: статика фронта + Django API + Go quotes-service.
# Всё на одном origin (oriontrade.tech), поэтому CORS/mixed-content не возникает.

upstream orion_api    { server api:8000; }
upstream orion_quotes { server quotes:8090; }

server {
    listen 80 default_server;
    server_name oriontrade.tech www.oriontrade.tech _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2m;
    charset utf-8;

    # --- Django REST API ---
    location ^~ /api/ {
        proxy_pass http://orion_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
        # динамика — не кешировать (в т.ч. если на CF включат "Cache Everything")
        add_header Cache-Control "no-store" always;
    }

    # --- Django admin + собранная статика (WhiteNoise) ---
    location ^~ /admin/ {
        proxy_pass http://orion_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        add_header Cache-Control "no-store" always;
    }
    location ^~ /static/ {
        proxy_pass http://orion_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # --- Go quotes-service: /quotes/price?symbol=... -> /price?symbol=... ---
    location ^~ /quotes/ {
        proxy_pass http://orion_quotes/;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    # --- dotfiles и служебные расширения наружу не отдаём ---
    location ~ /\. { return 404; }
    location ~* \.(py|sql|sh|ya?ml|mod|sum|toml|ini|cfg|log)$ { return 404; }

    # --- статика фронтенда: ассеты кешируем (снимает нагрузку с канала CF↔сервер,
    #     Cloudflare тоже начнёт их держать на edge при включённом кешировании) ---
    location ~* \.(css|js|mjs|png|jpe?g|gif|svg|webp|avif|ico|woff2?|ttf|eot|map)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location / {
        # HTML держим свежим — короткий revalidate, без долгого кеша.
        add_header Cache-Control "public, max-age=60";
        try_files $uri $uri/ =404;
    }
}
