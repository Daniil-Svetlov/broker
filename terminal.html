<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Торговля — LUMIT Trade (local)</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Критический минимум: чтобы страница не была белой и у графика была
         высота ДАЖЕ если внешний css/terminal.css не подгрузился (404/не та
         папка). Полный стиль ниже во внешнем файле — он переопределит эти
         правила, когда доступен. -->
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        background: #000; color: #fff;
        font-family: 'Inter', -apple-system, sans-serif;
        overflow-x: hidden;
      }
      .main { display: flex; height: 100vh; width: 100%; }
      /* Без этой высоты график создаётся 0×0 и не виден. */
      #chart { flex: 1; min-height: 420px; position: relative; }
    </style>
    <link rel="stylesheet" href="css/terminal.css">
    <script src="config.js"></script>
    <script defer src="scripts/terminal-script.js"></script>
  </head>
  <body>
    <div class="ambient-bg">
      <div class="ambient-orb"></div>
      <div class="ambient-orb"></div>
      <div class="ambient-orb"></div>
      <div class="ambient-orb"></div>
    </div>
    <div class="noise-overlay"></div>
    <div class="overlay" id="overlay" onclick="closePanels()"></div>
    <header class="glass">
      <div class="logo-area">
        <div class="logo-icon">L</div>
        <div class="logo-text">LUMIT <span>Trade</span></div>
      </div>
      <div class="right-buttons">
        <div class="stats-block">
          <div class="stat-item">
            <span class="stat-label">Профит</span>
            <span class="stat-value profit" id="total-profit">+$0.00</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Винрейт</span>
            <span class="stat-value" id="win-rate">0%</span>
          </div>
        </div>
        <div class="account-switcher" id="account-switcher">
          <button class="account-trigger" id="account-trigger" onclick="toggleAccountMenu(event)">
            <span class="account-badge" id="account-badge">DEMO</span>
            <span class="balance-amount" id="balance-amount-header">$0.00</span>
            <svg class="arrow" viewBox="0 0 24 24" fill="none" xmlns="http://w3.org">
              <path d="M5 3l14 9-14 9V3z" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <div class="account-dropdown" id="account-dropdown">
            <button class="account-option active" data-account-type="demo" onclick="selectAccountType('demo')">
              <span class="account-option-dot demo-dot"></span>
              <span class="account-option-text">
                <span class="account-option-label">Демо-счёт</span>
                <span class="account-option-balance" id="account-balance-demo">$0.00</span>
              </span>
            </button>
            <button class="account-option" data-account-type="real" onclick="selectAccountType('real')">
              <span class="account-option-dot real-dot"></span>
              <span class="account-option-text">
                <span class="account-option-label">Реальный счёт</span>
                <span class="account-option-balance" id="account-balance-real">$0.00</span>
              </span>
            </button>
          </div>
        </div>
        <button class="right-btn" title="Уведомления">
          <svg class="bell-icon" viewBox="0 0 24 24" fill="none" xmlns="http://w3.org">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button class="right-btn" onclick="window.location.href='profile.html'"title="Профиль">
          <svg class="profile-icon" viewBox="0 0 24 24" fill="none" xmlns="http://w3.org">
            <path d="M20 21C20 19.6044 20 18.9067 19.7578 18.3578C19.4322 17.6194 18.8413 17.0285 18.1029 16.7029C17.554 16.4607 16.8562 16.4607 15.4607 16.4607H8.53934C7.14378 16.4607 6.446 16.4607 5.89711 16.7029C5.15873 17.0285 4.56779 17.6194 4.24221 18.3578C4 18.9067 4 19.6044 4 21M16.5 7.5C16.5 9.98528 14.4853 12 12 12C9.51472 12 7.5 9.98528 7.5 7.5C7.5 5.01472 9.51472 3 12 3C14.4853 3 16.5 5.01472 16.5 7.5Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button class="right-btn deposit-btn">Пополнить</button>
      </div>
    </header>
    <div class="main">
      <div class="left-bar" id="left-bar">
        <div class="category-item">
          <button class="main-category">
            <div class="category-name">
              <svg class="timer-icon" viewBox="0 0 24 24" fill="none" xmlns="http://w3.org">
                <circle cx="12" cy="13" r="8" stroke="currentColor" stroke-width="2"/>
                <path d="M12 9v4l2.5 1.5M10 2h4M12 2v3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span>Таймфрейм</span>
            </div>
            <svg class="arrow" viewBox="0 0 24 24" fill="none" xmlns="http://w3.org">
              <path d="M5 3l14 9-14 9V3z" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <div class="submenu">
            <button class="sub-btn active" data-tf="60" onclick="setTimeframe(60)"><span class="sub-icon">1м</span> 1 минута</button>
            <button class="sub-btn" data-tf="300" onclick="setTimeframe(300)"><span class="sub-icon">5м</span> 5 минут</button>
          </div>
        </div>
        <div class="category-item">
          <button class="main-category open">
            <div class="category-name">
              <svg class="coin-icon" viewBox="0 0 24 24" fill="none" xmlns="http://w3.org">
                <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/>
                <path d="M12 7v10M14 9h-3a1.5 1.5 0 0 0 0 3h2a1.5 1.5 0 0 1 0 3H9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
            <span>Валютные пары</span>
            </div>
            <svg class="arrow" viewBox="0 0 24 24" fill="none" xmlns="http://w3.org">
              <path d="M5 3l14 9-14 9V3z" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <!-- Список пар наполняется из /api/assets/ (terminal-script.js, loadAssets). -->
          <div class="submenu open" id="pairs-menu">
            <button class="sub-btn" disabled>Загрузка пар…</button>
          </div>
        </div>
        <div class="category-item">
          <button class="main-category">
            <div class="category-name">
              <svg class="bar-chart-icon" viewBox="0 0 24 24" fill="none" xmlns="http://w3.org">
                <path d="M18 20V10M12 20V4M6 20v-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span>Вид графика</span>
            </div>
            <svg class="arrow" viewBox="0 0 24 24" fill="none" xmlns="http://w3.org">
              <path d="M5 3l14 9-14 9V3z" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <div class="submenu" id="chart-type-menu">
            <button class="sub-btn active" data-chart-type="line" onclick="switchChartType('line')">
              <span class="sub-icon">
                <svg class="trend-up-icon" viewBox="0 0 24 24" fill="none" xmlns="http://w3.org">
                  <path d="M23 6l-9.5 9.5-5-5L1 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg> 
              </span>
              Линия
            </button>
            <button class="sub-btn" data-chart-type="candles" onclick="switchChartType('candles')">
              <span class="sub-icon">
                <svg class="bar-chart-icon" viewBox="0 0 24 24" fill="none" xmlns="http://w3.org">
                  <path d="M18 20V10M12 20V4M6 20v-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
              Свечи
            </button>
            <button class="sub-btn" data-chart-type="bars" onclick="switchChartType('bars')">
              <span class="sub-icon">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://w3.org">
                  <path d="M6 4v16M6 9h4M6 15h4M18 4v16M14 8h4M14 16h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
              Бары
            </button>
                        <!-- Меню выбора таймфрейма -->
            <div class="menu-category">
              <button class="main-category">
                <span class="icon">⏱️</span> Таймфрейм
              </button>
              <div class="submenu" id="timeframe-menu">
                <button class="sub-btn" data-tf="5" onclick="setTimeframe(5)">5 секунд</button>
                <button class="sub-btn" data-tf="10" onclick="setTimeframe(10)">10 секунд</button>
                <button class="sub-btn active" data-tf="60" onclick="setTimeframe(60)">1 минута</button>
                <button class="sub-btn" data-tf="300" onclick="setTimeframe(300)">5 минут</button>
                <button class="sub-btn" data-tf="900" onclick="setTimeframe(900)">15 минут</button>
                <button class="sub-btn" data-tf="3600" onclick="setTimeframe(3600)">1 час</button>
              </div>
            </div>
          </div>
        </div>
        <div class="category-item">
          <button class="main-category" data-no-submenu onclick="openIndicatorModal()">
            <div class="category-name">
              <svg class="indicator-icon" viewBox="0 0 24 24" fill="none" xmlns="http://w3.org">
                <path d="M3 12h3l2-7 4 14 3-10 2 6h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span>Индикаторы</span>
            </div>
          </button>
        </div>
        <div class="category-divider"></div>
        <div class="category-item">
          <button class="main-category">
            <div class="category-name">
              <svg class="draw-icon" viewBox="0 0 24 24" fill="none" xmlns="http://w3.org">
                <path d="M12 19l7-7 3 3-7 7-3-3z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span>Рисование</span>
            </div>
            <svg class="arrow" viewBox="0 0 24 24" fill="none" xmlns="http://w3.org">
              <path d="M5 3l14 9-14 9V3z" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <div class="submenu" id="drawing-menu">
            <button class="sub-btn" data-tool="hline" onclick="setDrawTool('hline')">
              <span class="sub-icon">—</span> Гориз. линия
            </button>
            <button class="sub-btn" data-tool="trend" onclick="setDrawTool('trend')">
              <span class="sub-icon">╱</span> Трендовая линия
            </button>
            <button class="sub-btn" data-tool="rect" onclick="setDrawTool('rect')">
              <span class="sub-icon">▭</span> Прямоугольник
            </button>
            <button class="sub-btn" data-tool="fib" onclick="setDrawTool('fib')">
              <span class="sub-icon">Fib</span> Фибоначчи
            </button>
            <button class="sub-btn" data-tool="erase" onclick="setDrawTool('erase')">
              <span class="sub-icon">✕</span> Удалить фигуру
            </button>
            <button class="sub-btn" onclick="clearDrawings()">
              <span class="sub-icon">
                <svg class="refresh-icon" viewBox="0 0 24 24" fill="none" xmlns="http://w3.org">
                  <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
              Очистить всё
            </button>
          </div>
        </div>
        <div class="category-item">
          <button class="main-category">
            <div class="category-name">
              <svg class="history-icon" viewBox="0 0 24 24" fill="none" xmlns="http://w3.org">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M14 2v6h6M16 13H8M16 17H8M10 9H8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span>История</span>
            </div>
            <svg class="arrow" viewBox="0 0 24 24" fill="none" xmlns="http://w3.org">
              <path d="M5 3l14 9-14 9V3z" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <div class="submenu">
            <button class="sub-btn" onclick="socket.emit('get_history')">
              <span class="sub-icon">
                <svg class="bar-chart-icon" viewBox="0 0 24 24" fill="none" xmlns="http://w3.org">
                  <path d="M18 20V10M12 20V4M6 20v-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span> 
              Мои сделки
            </button>
          </div>
        </div>
        <div class="category-item">
          <button class="main-category">
            <div class="category-name">
              <svg class="actions-icon" viewBox="0 0 24 24" fill="none" xmlns="http://w3.org">
                <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span>Действия</span>
            </div>
            <svg class="arrow" viewBox="0 0 24 24" fill="none" xmlns="http://w3.org">
              <path d="M5 3l14 9-14 9V3z" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <div class="submenu">
            <button class="sub-btn" onclick="resetDemo()">
              <span class="sub-icon">
                <svg class="refresh-icon" viewBox="0 0 24 24" fill="none" xmlns="http://w3.org">
                  <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l.73-1.19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
              Обновить баланс
            </button>
          </div>
        </div>
        <div class="settings">
          <a class="settings-link" href="http://localhost:3030/profile">
            <svg class="settings-icon" viewBox="0 0 24 24" fill="none" xmlns="http://w3.org">
              <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>Настройки</span>
          </a>
        </div>
      </div>
      <div class="chart-column">
        <div id="chart">
          <canvas id="drawing-canvas"></canvas>
          <div class="chart-skeleton" id="chart-skeleton">
            <div class="skel-bars">
              <div class="skel-bar"></div>
              <div class="skel-bar"></div>
              <div class="skel-bar"></div>
              <div class="skel-bar"></div>
              <div class="skel-bar"></div>
              <div class="skel-bar"></div>
            </div>
            <div class="skel-text">Загрузка графика…</div>
          </div>
          <div class="active-indicators" id="active-indicators-panel"></div>
        </div>
        <div class="sub-panes" id="sub-panes"></div>
      </div>
      <div class="sidebar" id="sidebar">
        <div class="trade-info-card">
          <div class="trade-info-row">
            <span class="trade-info-label">Текущая цена</span>
            <span class="trade-info-value" id="current-price">—</span>
          </div>
          <div class="trade-info-row">
            <span class="trade-info-label">Пара</span>
            <span class="trade-info-value" id="current-pair">EUR/USD</span>
          </div>
        </div>
        <div class="input-group">
          <label>Сумма ставки ($)</label>
          <input type="number" id="amount" value="10" min="1" step="1">
        </div>
        <div class="input-group">
          <label>Время экспирации (сек)</label>
          <input type="number" id="time" value="30" min="5" max="300" step="5">
        </div>
        <div id="status-bar">Подключение...</div>
        <div class="active-trades" id="active-trades-container"></div>
        <div class="trade-actions">
          <button class="btn-trade btn-up" id="btnUp">
            <div>
              <span>ВЫШЕ</span>
              <svg class="trade-icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" xmlns="http://w3.org">
                <path d="M12 4L22 20H2L12 4Z"/>
              </svg>
            </div>
          </button>
          <button class="btn-trade btn-down" id="btnDown">
            <div>
              <span>НИЖЕ</span>
              <svg class="trade-icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" xmlns="http://w3.org">
                <path d="M12 20L2 4H22L12 20Z"/>
              </svg>
            </div>
          </button>
        </div>
        <button class="btn-reset" onclick="resetDemo()">
          <svg class="refresh-icon" viewBox="0 0 24 24" fill="none" xmlns="http://w3.org">
            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l.73-1.19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Обновить баланс</span>
        </button>
      </div>
    </div>
    <div class="modal-overlay" id="indicator-modal-overlay" onclick="closeIndicatorModalOnOverlay(event)">
      <div class="indicator-modal glass-strong">
        <div class="indicator-modal-header">
          <h3>Индикаторы</h3>
          <button class="modal-close-btn" onclick="closeIndicatorModal()">✕</button>
        </div>
        <div class="indicator-tabs">
          <button class="indicator-tab active" data-cat="trend" onclick="switchIndicatorTab('trend')">Трендовые</button>
          <button class="indicator-tab" data-cat="oscillator" onclick="switchIndicatorTab('oscillator')">Осцилляторы</button>
          <button class="indicator-tab" data-cat="volume" onclick="switchIndicatorTab('volume')">Объём</button>
        </div>
        <div class="indicator-list" id="indicator-list-trend">
          <button class="indicator-catalog-item" onclick="addIndicator('SMA')">
            <span class="indicator-catalog-name">SMA</span>
            <span class="indicator-catalog-desc">Простая скользящая средняя</span>
          </button>
          <button class="indicator-catalog-item" onclick="addIndicator('EMA')">
            <span class="indicator-catalog-name">EMA</span>
            <span class="indicator-catalog-desc">Экспоненциальная скользящая средняя</span>
          </button>
          <button class="indicator-catalog-item" onclick="addIndicator('BB')">
            <span class="indicator-catalog-name">Bollinger Bands</span>
            <span class="indicator-catalog-desc">Канал волатильности</span>
          </button>
        </div>
        <div class="indicator-list" id="indicator-list-oscillator" style="display:none">
          <button class="indicator-catalog-item" onclick="addIndicator('RSI')">
            <span class="indicator-catalog-name">RSI</span>
            <span class="indicator-catalog-desc">Индекс относительной силы</span>
          </button>
          <button class="indicator-catalog-item" onclick="addIndicator('MACD')">
            <span class="indicator-catalog-name">MACD</span>
            <span class="indicator-catalog-desc">Схождение/расхождение скользящих средних</span>
          </button>
        </div>
        <div class="indicator-list" id="indicator-list-volume" style="display:none">
          <div class="indicator-empty-note">Бэкенд пока не отдаёт объём тиками — раздел будет заполнен позже.</div>
        </div>
      </div>
    </div>
    <div class="modal-overlay" id="indicator-settings-overlay" onclick="closeIndicatorSettingsOnOverlay(event)">
      <div class="indicator-settings-modal glass-strong" id="indicator-settings-modal">
        <!-- содержимое рендерится в JS под конкретный индикатор -->
      </div>
    </div>
    <button class="mobile-btn" id="mobile-left" onclick="toggleLeft()">
      <svg class="menu-icon" viewBox="0 0 24 24" fill="none" xmlns="http://w3.org">
        <path d="M3 12h18M3 6h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </body>
</html>
