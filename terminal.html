<!DOCTYPE html>
<!--
  ЛОКАЛЬНАЯ проверочная версия терминала (ветка main + новый бэкенд).
  Отличия от main/terminal.html:
   * убран <script socket.io> — данные берём по REST (Go /price + Django /api);
   * подключён config.js (адреса бэка + accountId демо-счёта);
   * валютные пары заменены на те, что реально отдаёт quotes-service (форекс);
   * onclick="socket.emit(...)" убраны (сокета больше нет).
  В прод НЕ идёт: это стенд для проверки связки фронт↔бэк.
-->
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Торговля — LUMIT Trade (local)</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Критический минимум: чтобы страница не была белой и у графика была
         высота ДАЖЕ если внешний css/terminal.css не подгрузился (404/не та
         папка). Полный стиль ниже во внешнем файле — он переопределит эти
         правила, когда доступен. -->
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        background: #000; color: #fff;
        font-family: 'Inter', -apple-system, sans-serif;
        overflow-x: hidden;
      }
      .main { display: flex; height: 100vh; width: 100%; }
      /* Без этой высоты график создаётся 0×0 и не виден. */
      #chart { flex: 1; min-height: 420px; position: relative; }
    </style>
    <link rel="stylesheet" href="css/terminal.css">
    <script src="config.js"></script>
    <script defer src="scripts/terminal-script.js"></script>
  </head>
  <body>
    <div class="ambient-bg">
      <div class="ambient-orb"></div>
      <div class="ambient-orb"></div>
      <div class="ambient-orb"></div>
      <div class="ambient-orb"></div>
    </div>
    <div class="noise-overlay"></div>
    <div class="overlay" id="overlay" onclick="closePanels()"></div>
    <header class="glass">
      <div class="logo-area">
        <div class="logo-icon">L</div>
        <div class="logo-text">LUMIT <span>Trade</span></div>
      </div>
      <div class="right-buttons">
        <div class="stats-block">
          <div class="stat-item">
            <span class="stat-label">Профит</span>
            <span class="stat-value profit" id="total-profit">+$0.00</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Винрейт</span>
            <span class="stat-value" id="win-rate">0%</span>
          </div>
        </div>
        <div class="balance-block">
          <span class="balance-label">Демо-баланс</span>
          <span class="balance-amount" id="balance-amount-header">$0.00</span>
        </div>
        <button class="right-btn" title="Уведомления">
          <svg class="bell-icon" viewBox="0 0 24 24" fill="none" xmlns="http://w3.org">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button class="right-btn" onclick="window.location.href='profile.html'"title="Профиль">
          <svg class="profile-icon" viewBox="0 0 24 24" fill="none" xmlns="http://w3.org">
            <path d="M20 21C20 19.6044 20 18.9067 19.7578 18.3578C19.4322 17.6194 18.8413 17.0285 18.1029 16.7029C17.554 16.4607 16.8562 16.4607 15.4607 16.4607H8.53934C7.14378 16.4607 6.446 16.4607 5.89711 16.7029C5.15873 17.0285 4.56779 17.6194 4.24221 18.3578C4 18.9067 4 19.6044 4 21M16.5 7.5C16.5 9.98528 14.4853 12 12 12C9.51472 12 7.5 9.98528 7.5 7.5C7.5 5.01472 9.51472 3 12 3C14.4853 3 16.5 5.01472 16.5 7.5Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button class="right-btn deposit-btn">Пополнить</button>
      </div>
    </header>
    <div class="main">
      <div class="left-bar" id="left-bar">
        <div class="category-item">
          <button class="main-category">
            <div class="category-name">
              <svg class="timer-icon" viewBox="0 0 24 24" fill="none" xmlns="http://w3.org">
                <circle cx="12" cy="13" r="8" stroke="currentColor" stroke-width="2"/>
                <path d="M12 9v4l2.5 1.5M10 2h4M12 2v3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span>Таймфрейм</span>
            </div>
            <svg class="arrow" viewBox="0 0 24 24" fill="none" xmlns="http://w3.org">
              <path d="M5 3l14 9-14 9V3z" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <div class="submenu">
            <button class="sub-btn"><span class="sub-icon">1м</span> 1 минута</button>
            <button class="sub-btn"><span class="sub-icon">5м</span> 5 минут</button>
          </div>
        </div>
        <div class="category-item">
          <button class="main-category open">
            <div class="category-name">
              <svg class="coin-icon" viewBox="0 0 24 24" fill="none" xmlns="http://w3.org">
                <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/>
                <path d="M12 7v10M14 9h-3a1.5 1.5 0 0 0 0 3h2a1.5 1.5 0 0 1 0 3H9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
            <span>Валютные пары</span>
            </div>
            <svg class="arrow" viewBox="0 0 24 24" fill="none" xmlns="http://w3.org">
              <path d="M5 3l14 9-14 9V3z" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <div class="submenu open">
            <button class="sub-btn active" data-pair="EUR/USD">
              <span class="sub-icon">€</span>
              Euro / Dollar
            </button>
            <button class="sub-btn" data-pair="GBP/USD">
              <span class="sub-icon">£</span>
              Pound / Dollar
            </button>
            <button class="sub-btn" data-pair="USD/JPY">
              <span class="sub-icon">¥</span>
              Dollar / Yen
            </button>
          </div>
        </div>
        <div class="category-divider"></div>
        <div class="category-item">
          <button class="main-category">
            <div class="category-name">
              <svg class="actions-icon" viewBox="0 0 24 24" fill="none" xmlns="http://w3.org">
                <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span>Действия</span>
            </div>
            <svg class="arrow" viewBox="0 0 24 24" fill="none" xmlns="http://w3.org">
              <path d="M5 3l14 9-14 9V3z" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <div class="submenu">
            <button class="sub-btn" onclick="resetDemo()">
              <span class="sub-icon">
                <svg class="refresh-icon" viewBox="0 0 24 24" fill="none" xmlns="http://w3.org">
                  <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l.73-1.19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
              Обновить баланс
            </button>
          </div>
        </div>
      </div>
      <div id="chart"></div>
      <div class="sidebar" id="sidebar">
        <div class="trade-info-card">
          <div class="trade-info-row">
            <span class="trade-info-label">Текущая цена</span>
            <span class="trade-info-value" id="current-price">—</span>
          </div>
          <div class="trade-info-row">
            <span class="trade-info-label">Пара</span>
            <span class="trade-info-value" id="current-pair">EUR/USD</span>
          </div>
        </div>
        <div class="input-group">
          <label>Сумма ставки ($)</label>
          <input type="number" id="amount" value="10" min="1" step="1">
        </div>
        <div class="input-group">
          <label>Время экспирации (сек)</label>
          <input type="number" id="time" value="30" min="5" max="300" step="5">
        </div>
        <div id="status-bar">Подключение...</div>
        <div class="active-trades" id="active-trades-container"></div>
        <div class="trade-actions">
          <button class="btn-trade btn-up" id="btnUp">ВЫШЕ ▲</button>
          <button class="btn-trade btn-down" id="btnDown">НИЖЕ ▼</button>
        </div>
        <button class="btn-reset" onclick="resetDemo()">
          <svg class="refresh-icon" viewBox="0 0 24 24" fill="none" xmlns="http://w3.org">
            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l.73-1.19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Обновить баланс</span>
        </button>
      </div>
    </div>
    <button class="mobile-btn" id="mobile-left" onclick="toggleLeft()">
      <svg class="menu-icon" viewBox="0 0 24 24" fill="none" xmlns="http://w3.org">
        <path d="M3 12h18M3 6h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button class="mobile-btn" id="mobile-right" onclick="toggleRight()">
      <svg class="currency-trend-icon" viewBox="0 0 24 24" fill="none" xmlns="http://w3.org">
        <path d="M3 3v16a2 2 0 0 0 2 2h16M7 14l4-4 4 4 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </body>
</html>
