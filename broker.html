<!-- основная страничка для бо -->
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>LUMIT Broker на рабочем столе</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <style>
        :root { --bg: #0b0e11; --panel: #161a1e; --accent: #ffffff; --green: #2ebd85; --red: #f6465d; --border: #2b3139; }
        
        * { outline: none !important; -webkit-tap-highlight-color: transparent; }

        body { background: var(--bg); color: #eaecef; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        header { background: var(--panel); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); position: relative; z-index: 20; }
        
        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo-icon { width: 32px; height: 32px; background: var(--accent); border-radius: 6px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .logo-icon img { width: 100%; height: 100%; object-fit: cover; }
        .logo-text { color: var(--accent); font-weight: bold; font-size: 20px; letter-spacing: 2px; }

        .main { display: flex; flex: 1; overflow: hidden; background: var(--bg); position: relative; }

        .left-bar { 
            width: 60px; 
            background: var(--panel); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding-top: 20px; 
            gap: 20px;
            border-right: 1px solid var(--border);
            position: relative;
            z-index: 10; 
        }

        .tool-btn { 
            width: 35px; height: 35px; 
            background: #2b3139; border-radius: 6px; 
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; font-weight: bold; color: #848e9c; cursor: pointer;
        }

        #chart { 
            flex: 1; 
            position: relative; 
            margin-left: -2px; /* Спрятали ту самую линию */
            z-index: 5; 
        }

        .sidebar { 
            width: 260px; 
            background: var(--panel); 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
            border-left: 1px solid var(--border);
            position: relative;
            z-index: 10;
        }
        
        label { font-size: 11px; color: #848e9c; font-weight: bold; }
        input { background: #2b3139; border: 1px solid #474d57; color: white; padding: 12px; border-radius: 4px; width: 100%; box-sizing: border-box; }
        
        .btn { padding: 18px; border: none; border-radius: 4px; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 14px; }
        .btn:active { transform: scale(0.98); }
        .btn-up { background: var(--green); }
        .btn-down { background: var(--red); }
        
        #status-bar { text-align: center; color: #f0b90b; font-size: 13px; min-height: 20px; padding: 10px; border: 1px solid var(--border); border-radius: 4px; }
    </style>
</head>
<body>
    <header>
        <div class="logo-area">
            <div class="logo-icon">
                <img src="https://cdn-icons-png.flaticon.com/512/2502/2502160.png" alt="L">
            </div>
            <div class="logo-text">LUMIT_TRADE</div>
        </div>
        <div style="font-weight: bold; font-size: 18px;">Баланс: <span id="balance-amount">1000.00</span> $</div>
    </header>

    <div class="main">
        <div class="left-bar">
            <div class="tool-btn">ТФ</div>
            <div class="tool-btn">ГР</div>
            <div class="tool-btn">ИН</div>
        </div>

        <div id="chart"></div>

        <div class="sidebar">
            <div>
                <label>СУММА ($)</label>
                <input type="number" id="amount" value="10">
            </div>
            <div>
                <label>ВРЕМЯ (СЕК)</label>
                <input type="number" id="time" value="5">
            </div>
            <div id="status-bar">Рынок открыт</div>
            <button class="btn btn-up" onclick="sendTrade('higher')">ВЫШЕ ▲</button>
            <button class="btn btn-down" onclick="sendTrade('lower')">НИЖЕ ▼</button>
        </div>
    </div>

    <script>
        window.onload = () => {
            const chartElement = document.getElementById('chart');
            
            // Инициализация графика
            const chart = LightweightCharts.createChart(chartElement, {
                layout: { background: { color: '#0b0e11' }, textColor: '#d1d4dc' },
                grid: { vertLines: { visible: false }, horzLines: { visible: false } },
                width: chartElement.clientWidth,
                height: chartElement.clientHeight,
                rightPriceScale: { borderVisible: false },
                timeScale: { borderVisible: false, timeVisible: true, secondsVisible: true },
            });

            // Твой рабочий метод создания линии
            let lineSeries;
            try {
                lineSeries = chart.addSeries(LightweightCharts.LineSeries, {
                    color: '#f0b90b',
                    lineWidth: 2,
                    priceLineVisible: false,
                    lastValueVisible: false
                });
            } catch (e) {
                lineSeries = chart.addLineSeries({
                    color: '#f0b90b',
                    lineWidth: 2,
                    priceLineVisible: false,
                    lastValueVisible: false
                });
            }

            // Подключение к серверу
            const socket = io(); 
            let balance = 1000.00;

            socket.on('price_update', (data) => {
                lineSeries.update(data);
            });

            // Функция отправки сделки
            window.sendTrade = (type) => {
                const amount = parseFloat(document.getElementById('amount').value);
                const time = parseInt(document.getElementById('time').value);
                
                if (amount > balance) {
                    alert("Недостаточно средств");
                    return;
                }

                document.getElementById('status-bar').innerText = "Сделка открыта...";
                socket.emit('make_trade', { type, amount, time });
            };

            socket.on('trade_result', (data) => {
                balance += data.profit;
                document.getElementById('balance-amount').innerText = balance.toFixed(2);
                document.getElementById('status-bar').innerText = `${data.result}: ${data.profit > 0 ? '+' : ''}${data.profit.toFixed(2)}$`;
                setTimeout(() => { document.getElementById('status-bar').innerText = "Рынок открыт"; }, 3000);
            });

            window.addEventListener('resize', () => {
                chart.applyOptions({ 
                    width: chartElement.clientWidth, 
                    height: chartElement.clientHeight 
                });
            });
        };
    </script>
</body>
</html>
