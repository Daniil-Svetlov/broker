<!-- основная страничка для бо -->
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>LUMIT Broker на рабочем столе</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <style>
        :root { --bg: #0b0e11; --panel: #161a1e; --accent: #ffffff; --green: #2ebd85; --red: #f6465d; --border: #2b3139; }
        
        * { outline: none !important; -webkit-tap-highlight-color: transparent; }

        body { background: var(--bg); color: #eaecef; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        header { background: var(--panel); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); position: relative; z-index: 20; }
        
        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo-icon { width: 32px; height: 32px; background: var(--accent); border-radius: 6px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .logo-icon img { width: 100%; height: 100%; object-fit: cover; }
        .logo-text { color: var(--accent); font-weight: bold; font-size: 20px; letter-spacing: 2px; }

        /* ПРАВЫЕ КНОПКИ */
        .right-buttons {
            display: flex;
            align-items: center;
            gap: 20px;
            background: rgba(43, 49, 57, 0.5);
            padding: 5px 15px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
        }
        .right-btn {
            background: transparent;
            border: none;
            color: #eaecef;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 30px;
            transition: 0.2s;
            font-family: inherit;
        }
        .right-btn:hover { background: #2b3139; }
        .notification-icon, .profile-icon { display: flex; align-items: center; gap: 6px; }
        .balance-block {
            background: #2b3139;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 15px;
            color: #2ebd85;
        }
        .deposit-btn { background: #f0b90b; color: #0b0e11; font-weight: bold; padding: 6px 14px; border-radius: 30px; }
        .deposit-btn:hover { background: #e0a800; transform: scale(0.97); }
        .extreme-btn { background: transparent; border: 1px solid #f6465d; color: #f6465d; }
        .extreme-btn:hover { background: #f6465d20; }

        .main { display: flex; flex: 1; overflow: hidden; background: var(--bg); position: relative; }

        /* ЛЕВАЯ ПАНЕЛЬ — АККОРДЕОН */
        .left-bar { 
            width: 220px; 
            background: var(--panel); 
            display: flex; 
            flex-direction: column; 
            padding: 15px 10px;
            gap: 8px;
            border-right: 1px solid var(--border);
            position: relative;
            z-index: 10;
            overflow-y: auto;
            flex-shrink: 0;
        }

        /* Основная кнопка (категория) */
        .main-category {
            background: #2b3139;
            border-radius: 8px;
            padding: 12px 12px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 14px;
            color: #eaecef;
            border: none;
            width: 100%;
            font-family: inherit;
        }
        .main-category:hover {
            background: #3b424b;
            transform: translateX(2px);
        }
        .main-category .arrow {
            transition: transform 0.2s;
            font-size: 12px;
            color: #848e9c;
        }
        .main-category.open .arrow {
            transform: rotate(90deg);
        }

        /* Вторичные кнопки (подменю) */
        .submenu {
            display: none;
            flex-direction: column;
            gap: 6px;
            margin-top: 8px;
            margin-bottom: 4px;
            padding-left: 8px;
        }
        .submenu.open {
            display: flex;
        }
        .sub-btn {
            background: #1e2329;
            border-radius: 6px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 12px;
            color: #c8ccd1;
            cursor: pointer;
            transition: 0.2s;
            border: none;
            width: 100%;
            font-family: inherit;
        }
        .sub-btn:hover {
            background: #2b3139;
            transform: translateX(4px);
            color: #f0b90b;
        }
        .sub-icon {
            font-size: 14px;
            min-width: 24px;
            text-align: center;
        }

        .category-divider {
            height: 1px;
            background: #2b3139;
            margin: 8px 0;
        }

        #chart { 
            flex: 1; 
            position: relative; 
            z-index: 5; 
        }

        .sidebar { 
            width: 260px; 
            background: var(--panel); 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
            border-left: 1px solid var(--border);
            position: relative;
            z-index: 10;
        }
        
        label { font-size: 11px; color: #848e9c; font-weight: bold; }
        input { background: #2b3139; border: 1px solid #474d57; color: white; padding: 12px; border-radius: 4px; width: 100%; box-sizing: border-box; }
        
        .btn { padding: 18px; border: none; border-radius: 4px; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 14px; }
        .btn:active { transform: scale(0.98); }
        .btn-up { background: var(--green); }
        .btn-down { background: var(--red); }
        
        #status-bar { text-align: center; color: #f0b90b; font-size: 13px; min-height: 20px; padding: 10px; border: 1px solid var(--border); border-radius: 4px; }
    </style>
</head>
<body>
    <header>
        <div class="logo-area">
            <div class="logo-icon">
                <img src="https://cdn-icons-png.flaticon.com/512/2502/2502160.png" alt="L">
            </div>
            <div class="logo-text">LUMIT_TRADE</div>
        </div>

        <div class="right-buttons">
            <div class="right-btn notification-icon">🔔</div>
            <div class="balance-block"><span id="balance-amount-header">1000.00</span>$</div>
            <div class="right-btn profile-icon">👤</div>
            <div class="right-btn deposit-btn">💳</div>
        </div>
    </header>

    <div class="main">
        <!-- Левая панель -->
        <div class="left-bar" id="leftBarAccordion">
            <!-- Категория: Таймфрейм -->
            <div class="category-item">
                <button class="main-category">
                    <span>⏱️ Таймфрейм</span>
                    <span class="arrow">▶</span>
                </button>
                <div class="submenu">
                    <button class="sub-btn"><span class="sub-icon">1м</span> 1 минута</button>
                    <button class="sub-btn"><span class="sub-icon">5м</span> 5 минут</button>
                    <button class="sub-btn"><span class="sub-icon">15м</span> 15 минут</button>
                    <button class="sub-btn"><span class="sub-icon">1ч</span> 1 час</button>
                    <button class="sub-btn"><span class="sub-icon">1д</span> 1 день</button>
                </div>
            </div>

            <!-- Категория: Вид графика -->
            <div class="category-item">
                <button class="main-category">
                    <span>📊 Вид графика</span>
                    <span class="arrow">▶</span>
                </button>
                <div class="submenu">
                    <button class="sub-btn"><span class="sub-icon">📈</span> Линия</button>
                    <button class="sub-btn"><span class="sub-icon">📊</span> Свечи</button>
                    <button class="sub-btn"><span class="sub-icon">📉</span> Бары</button>
                    <button class="sub-btn"><span class="sub-icon">●</span> Область</button>
                </div>
            </div>

            <!-- Категория: Инструменты -->
            <div class="category-item">
                <button class="main-category">
                    <span>✏️ Инструменты</span>
                    <span class="arrow">▶</span>
                </button>
                <div class="submenu">
                    <button class="sub-btn"><span class="sub-icon">━━</span> Горизонталь</button>
                    <button class="sub-btn"><span class="sub-icon">│</span> Вертикаль</button>
                    <button class="sub-btn"><span class="sub-icon">↗</span> Трендовая</button>
                    <button class="sub-btn"><span class="sub-icon">🟩</span> Прямоугольник</button>
                    <button class="sub-btn"><span class="sub-icon">🔘</span> Фибоначчи</button>
                    <button class="sub-btn"><span class="sub-icon">📏</span> Линейка</button>
                </div>
            </div>

            <!-- Категория: Индикаторы -->
            <div class="category-item">
                <button class="main-category">
                    <span>📈 Индикаторы</span>
                    <span class="arrow">▶</span>
                </button>
                <div class="submenu">
                    <button class="sub-btn"><span class="sub-icon">📊</span> RSI</button>
                    <button class="sub-btn"><span class="sub-icon">📉</span> MACD</button>
                    <button class="sub-btn"><span class="sub-icon">📈</span> Скользящая средняя</button>
                    <button class="sub-btn"><span class="sub-icon">📊</span> Боллинджер</button>
                    <button class="sub-btn"><span class="sub-icon">📈</span> Стохастик</button>
                </div>
            </div>

            <div class="category-divider"></div>

            <!-- Категория: Социум -->
            <div class="category-item">
                <button class="main-category">
                    <span>👥 Сообщество</span>
                    <span class="arrow">▶</span>
                </button>
                <div class="submenu">
                    <button class="sub-btn"><span class="sub-icon">🏆</span> Турниры</button>
                    <button class="sub-btn"><span class="sub-icon">🔧</span> Поддержка</button>
                    <button class="sub-btn"><span class="sub-icon">💬</span> Чат</button>
                    <button class="sub-btn"><span class="sub-icon">📱</span> Telegram</button>
                </div>
            </div>

            <!-- Отдельная кнопка без вложенности (удаление рисунков) -->
            <div class="category-item">
                <button class="main-category">
                    <span>🗑️ Действия</span>
                    <span class="arrow">▶</span>
                </button>
                <div class="submenu">
                    <button class="sub-btn"><span class="sub-icon">🗑️</span> Удалить все рисунки</button>
                </div>
            </div>
        </div>

        <div id="chart"></div>

        <div class="sidebar">
            <div>
                <label>СУММА ($)</label>
                <input type="number" id="amount" value="10">
            </div>
            <div>
                <label>ВРЕМЯ (СЕК)</label>
                <input type="number" id="time" value="5">
            </div>
            <div id="status-bar">Рынок открыт</div>
            <button class="btn btn-up" onclick="sendTrade('higher')">ВЫШЕ ▲</button>
            <button class="btn btn-down" onclick="sendTrade('lower')">НИЖЕ ▼</button>
        </div>
    </div>

    <script>
        // Левая панель
        document.querySelectorAll('.main-category').forEach(button => {
            button.addEventListener('click', () => {
                const parent = button.closest('.category-item');
                const submenu = parent.querySelector('.submenu');
                const isOpen = submenu.classList.contains('open');
                
                // Закрываем все остальные
                // document.querySelectorAll('.submenu').forEach(menu => {
                //     if (menu !== submenu) menu.classList.remove('open');
                // });
                // document.querySelectorAll('.main-category').forEach(btn => {
                //     if (btn !== button) btn.classList.remove('open');
                // });
                
                // Переключаем текущее
                if (isOpen) {
                    submenu.classList.remove('open');
                    button.classList.remove('open');
                } else {
                    submenu.classList.add('open');
                    button.classList.add('open');
                }
            });
        });

        window.onload = () => {
            const chartElement = document.getElementById('chart');
            
            const chart = LightweightCharts.createChart(chartElement, {
                layout: { background: { color: '#0b0e11' }, textColor: '#d1d4dc' },
                grid: { vertLines: { visible: false }, horzLines: { visible: false } },
                width: chartElement.clientWidth,
                height: chartElement.clientHeight,
                rightPriceScale: { borderVisible: false },
                timeScale: { borderVisible: false, timeVisible: true, secondsVisible: true },
            });

            let lineSeries;
            try {
                lineSeries = chart.addSeries(LightweightCharts.LineSeries, {
                    color: '#f0b90b',
                    lineWidth: 2,
                    priceLineVisible: false,
                    lastValueVisible: false
                });
            } catch (e) {
                lineSeries = chart.addLineSeries({
                    color: '#f0b90b',
                    lineWidth: 2,
                    priceLineVisible: false,
                    lastValueVisible: false
                });
            }

            const socket = io(); 
            let balance = 1000.00;

            const balanceSpanMain = document.getElementById('balance-amount');
            const balanceSpanHeader = document.getElementById('balance-amount-header');

            socket.on('price_update', (data) => {
                lineSeries.update(data);
            });

            window.sendTrade = (type) => {
                const amount = parseFloat(document.getElementById('amount').value);
                const time = parseInt(document.getElementById('time').value);
                
                if (amount > balance) {
                    alert("Недостаточно средств");
                    return;
                }

                document.getElementById('status-bar').innerText = "Сделка открыта...";
                socket.emit('make_trade', { type, amount, time });
            };

            socket.on('trade_result', (data) => {
                balance += data.profit;
                if(balanceSpanMain) balanceSpanMain.innerText = balance.toFixed(2);
                if(balanceSpanHeader) balanceSpanHeader.innerText = balance.toFixed(2);
                document.getElementById('status-bar').innerText = `${data.result}: ${data.profit > 0 ? '+' : ''}${data.profit.toFixed(2)}$`;
                setTimeout(() => { document.getElementById('status-bar').innerText = "Рынок открыт"; }, 3000);
            });

            window.addEventListener('resize', () => {
                chart.applyOptions({ 
                    width: chartElement.clientWidth, 
                    height: chartElement.clientHeight 
                });
            });
        };
    </script>
</body>
</html>
