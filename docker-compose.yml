# Полный стек брокера: Postgres + Go-сервис котировок + Django API.
#
#   docker compose up --build
#
# Порядок: postgres → django (миграции создают схему) → quotes (Go).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: binary
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d binary"]
      interval: 3s
      timeout: 3s
      retries: 10

  # Django применяет миграции (создаёт всю схему) и поднимает REST API.
  api:
    build: ./django-api
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: binary
      DB_USER: postgres
      DB_PASSWORD: "1234"
      QUOTES_SERVICE_URL: http://quotes:8090
      DJANGO_DEBUG: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Фоновое закрытие истёкших сделок (отдельный процесс, как cron/таймер).
  settler:
    build: ./django-api
    command: python manage.py settle_trades --watch --interval 1
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: binary
      DB_USER: postgres
      DB_PASSWORD: "1234"
      QUOTES_SERVICE_URL: http://quotes:8090
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

  # Go-сервис котировок: онлайн-курсы + живые тики + HTTP /price + запись истории.
  quotes:
    build: ./quotes-service
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: binary
      DB_USER: postgres
      DB_PASSWORD: "1234"
      HTTP_ADDR: ":8090"
    ports:
      - "8090:8090"
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  pgdata:
