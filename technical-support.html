<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Техподдержка LUMIT Trade</title>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="css/technical-support.css">
    </head>
    <body>
        <div class="ambient-bg">
            <div class="ambient-orb"></div>
            <div class="ambient-orb"></div>
            <div class="ambient-orb"></div>
            <div class="ambient-orb"></div>
        </div>
        <div class="noise-overlay"></div>
        <header class="glass" id="header">
            <a href="index.html" class="logo">
                <div class="logo-icon">L</div>
                <div class="logo-text">LUMIT <span>Trade</span></div>
            </a>
            <nav class="nav-menu">
                <a href="terminal.html" class="nav-link">Торговый терминал</a>
                <a href="profile.html" class="nav-link profile-link">
                    <svg class="profile-icon" viewBox="0 0 24 24" fill="none" xmlns="http://w3.org">
                        <path d="M20 21C20 19.6044 20 18.9067 19.7578 18.3578C19.4322 17.6194 18.8413 17.0285 18.1029 16.7029C17.554 16.4607 16.8562 16.4607 15.4607 16.4607H8.53934C7.14378 16.4607 6.446 16.4607 5.89711 16.7029C5.15873 17.0285 4.56779 17.6194 4.24221 18.3578C4 18.9067 4 19.6044 4 21M16.5 7.5C16.5 9.98528 14.4853 12.0 12 12.0C9.51472 12.0 7.5 9.98528 7.5 7.5C7.5 5.01472 9.51472 3.0 12 3.0C14.4853 3.0 16.5 5.01472 16.5 7.5Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>Профиль</span>
                </a>
            </nav>
        </header>
        <div class="support">
            <h1>Техподдержка</h1>
            <p>Если у вас возникла проблема, вы можете ознакомится с <a href="index.html" class="frequently-asked-questions">часто задаваемыми вопросами</a> или заполнить форму ниже</p>
            <form class="support-form glass" onsubmit="handleSubmit(event)" novalidate>
                <div class="input-group">
                    <input type="text" id="userName" required placeholder=" ">
                    <label for="userName">Ваше имя</label>
                    <span class="error-message"></span>
                </div>
                <div class="input-group">
                    <input type="email" id="userEmail" required placeholder=" ">
                    <label for="userEmail">Электронная почта</label>
                    <span class="error-message"></span>
                </div>
                <div class="input-group">
                    <textarea id="userMessage" required placeholder=" " rows="6"></textarea>
                    <label for="userMessage">Опишите вашу проблему</label>
                    <span class="error-message"></span>
                </div>
                <button type="submit" class="submit-btn">
                    <span>Отправить</span>
                </button>
            </form>
        </div>
        <script>
            function showError(inputElement, message) {
                const group = inputElement.parentElement;
                const errorSpan = group.querySelector('.error-message');
                group.classList.add('invalid');
                errorSpan.innerText = message;
            }

            function clearError(inputElement) {
                const group = inputElement.parentElement;
                group.classList.remove('invalid');
            }

            function handleSubmit(event) {
                event.preventDefault();

                const form = event.target;
                const nameInput = document.getElementById('userName');
                const emailInput = document.getElementById('userEmail');
                const messageInput = document.getElementById('userMessage');
                
                clearError(nameInput);
                clearError(emailInput);
                clearError(messageInput);

                let isValid = true;

                if (nameInput.value.trim() === '') {
                    showError(nameInput, 'Пожалуйста, введите ваше имя');
                    isValid = false;
                } else if (nameInput.value.trim().length < 4) {
                    showError(nameInput, 'Имя должно содержать минимум 4 символа');
                    isValid = false;
                }

                const emailRegex = /^[^\s@]+@[^\s@.]+\.[^\s@.]+$/;
                if (emailInput.value.trim() === '') {
                    showError(emailInput, 'Введите адрес электронной почты');
                    isValid = false;
                } else if (!emailRegex.test(emailInput.value.trim())) {
                    showError(emailInput, 'Введите корректный адрес электронной почты');
                    isValid = false;
                }

                if (messageInput.value.trim() === '') {
                    showError(messageInput, 'Опишите вашу проблему');
                    isValid = false;
                } else if (messageInput.value.trim().length < 10) {
                    showError(messageInput, 'Описание должно содержать минимум 10 символов');
                    isValid = false;
                }

                if (!isValid) return;

                console.log('Данные к отправке:', nameInput.value.trim(), emailInput.value.trim(), messageInput.value.trim()); 

                const btn = form.querySelector('.submit-btn');
                const btnText = btn.querySelector('span');
                const originalText = btnText.innerText;
                btnText.innerText = 'Отправлено!';
                btn.classList.add('success');
                form.reset(); 
                setTimeout(() => {
                    btnText.innerText = originalText;
                    btn.classList.remove('success');
                }, 3000);
            }

            document.querySelectorAll('.input-group input, .input-group textarea').forEach(element => {
                element.addEventListener('input', () => clearError(element));
            });
        </script>
    </body>
</html>
