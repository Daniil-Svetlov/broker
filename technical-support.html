<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Техподдержка LUMIT</title>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
        <style>
            :root {
                --glass-bg: rgba(255, 255, 255, 0.08);
                --glass-bg-hover: rgba(255, 255, 255, 0.12);
                --glass-border: rgba(255, 255, 255, 0.15);
                --glass-border-light: rgba(255, 255, 255, 0.25);
                --glass-shadow: rgba(0, 0, 0, 0.3);
                --accent: #007AFF;
                --accent-glow: rgba(0, 122, 255, 0.4);
                --accent-secondary: #5856D6;
                --accent-tertiary: #00D4AA;
                --accent-quaternary: #FF9F0A;
                --green: #30D158;
                --red: #FF453A;
                --orange: #FF9F0A;
                --text-primary: #ffffff;
                --text-secondary: rgba(255, 255, 255, 0.6);
                --text-tertiary: rgba(255, 255, 255, 0.4);
                --bg-deep: #000000;
                --radius-sm: 12px;
                --radius-md: 20px;
                --radius-lg: 28px;
                --radius-xl: 40px;
            }

            *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

            html { scroll-behavior: smooth; }

            body {
                font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
                background: var(--bg-deep);
                color: var(--text-primary);
                overflow-x: hidden;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            /* --- AMBIENT BACKGROUND --- */
            .ambient-bg {
                position: fixed;
                inset: 0;
                z-index: -1;
                overflow: hidden;
            }

            .ambient-orb {
                position: absolute;
                border-radius: 50%;
                filter: blur(120px);
                opacity: 0.5;
                animation: float 20s ease-in-out infinite;
            }

            .ambient-orb:nth-child(1) {
                width: 600px; height: 600px;
                background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
                top: -200px; left: -100px;
                animation-delay: 0s;
            }

            .ambient-orb:nth-child(2) {
                width: 500px; height: 500px;
                background: radial-gradient(circle, var(--accent-secondary) 0%, transparent 70%);
                top: 40%; right: -150px;
                animation-delay: -7s;
            }

            .ambient-orb:nth-child(3) {
                width: 450px; height: 450px;
                background: radial-gradient(circle, var(--accent-tertiary) 0%, transparent 70%);
                bottom: -100px; left: 30%;
                animation-delay: -14s;
            }

            .ambient-orb:nth-child(4) {
                width: 350px; height: 350px;
                background: radial-gradient(circle, var(--accent-quaternary) 0%, transparent 70%);
                top: 20%; left: 50%;
                animation-delay: -3s;
                opacity: 0.3;
            }

            @keyframes float {
                0%, 100% { transform: translate(0, 0) scale(1); }
                25% { transform: translate(50px, -30px) scale(1.05); }
                50% { transform: translate(-30px, 50px) scale(0.95); }
                75% { transform: translate(40px, 20px) scale(1.02); }
            }

            .noise-overlay {
                position: fixed;
                inset: 0;
                z-index: 0;
                opacity: 0.03;
                pointer-events: none;
                background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
                background-repeat: repeat;
                background-size: 256px 256px;
            }

            .support {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 120px 24px 80px;
            text-align: center;
            position: relative;
            }

            .support h1{
                font-size: clamp(36px, 6vw, 72px);
                font-weight: 700;
                line-height: 1.1;
                letter-spacing: 2px;
                margin-bottom: 24px;
                background: linear-gradient(135deg, var(--accent) 0%, var(--accent-tertiary) 50%, var(--accent-secondary) 100%);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
                animation: fadeInUp 0.8s ease-out 0.1s both;
            }

            @keyframes fadeInUp {
                from { opacity: 0; transform: translateY(30px); }
                to { opacity: 1; transform: translateY(0); }
            }

            .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px var(--glass-shadow), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            }

            header {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 48px);
            max-width: 1400px;
            padding: 14px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            border-radius: var(--radius-lg);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            }

            .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text-primary);
            }

            .logo-icon {
            width: 36px; height: 36px;
            background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 16px;
            box-shadow: 0 4px 16px var(--accent-glow);
            }

            .logo-text {
            font-weight: 700;
            font-size: 18px;
            letter-spacing: -0.5px;
            }

            .logo-text span {
            color: var(--text-secondary);
            font-weight: 400;
            }

            .nav-menu {
            display: flex;
            align-items: center;
            gap: 24px;
            }

            .nav-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            }

            .nav-link:hover {
            color: var(--text-primary);
            }

            .profile-link {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            }

            .profile-icon {
            width: 18px;
            height: 18px;
            transition: transform 0.3s ease;
            }

            .profile-link:hover {
            background: var(--glass-bg-hover);
            border-color: var(--accent);
            box-shadow: 0 0 12px var(--accent-glow);
            }

            .support p {
            color: var(--text-primary);
            font-size: clamp(16px, 2vw, 20px);
            max-width: 600px;
            margin: 0 auto 48px;
            line-height: 1.6;
            font-weight: 400;
            animation: fadeInUp 0.8s ease-out 0.2s both;
            }

            .frequently-asked-questions {
            color: var(--accent);
            text-decoration: none; 
            font-weight: 500;
            position: relative;
            display: inline-block;
            transition: color 0.3s ease, text-shadow 0.3s ease;
            }

            .frequently-asked-questions::after {
            content: '';
            position: absolute;
            width: 100%;
            transform: scaleX(0); 
            height: 1.5px; 
            bottom: -2px;
            left: 0;
            background: linear-gradient(90deg, var(--accent), var(--accent-secondary)); 
            transform-origin: bottom center;
            transition: transform 0.3s ease;
            }

            .frequently-asked-questions:hover {
            color: var(--text-primary);
            text-shadow: 0 0 12px var(--accent-glow);
            }

            .frequently-asked-questions:hover::after {
            transform: scaleX(1);
            }

            .support-form {
            width: 100%;
            max-width: 500px;
            padding: 40px;
            border-radius: var(--radius-lg);
            display: flex;
            flex-direction: column;
            gap: 28px;
            animation: fadeInUp 1s ease-out 0.5s both;
            }

            .input-group {
            position: relative;
            width: 100%;
            }

            .input-group input,
            .input-group textarea {
            width: 100%;
            padding: 16px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
            }

            .input-group input:focus,
            .input-group textarea:focus {
            border-color: var(--accent);
            background: var(--glass-bg-hover);
            box-shadow: 0 0 15px var(--accent-glow);
            }

            .input-group label {
            position: absolute;
            left: 16px;
            top: 16px;
            color: var(--text-tertiary);
            pointer-events: none;
            transition: all 0.3s ease;
            }

            .input-group input:focus ~ label,
            .input-group input:not(:placeholder-shown) ~ label,
            .input-group textarea:focus ~ label,
            .input-group textarea:not(:placeholder-shown) ~ label {
            top: -20px;
            left: 4px;
            font-size: 12px;
            color: var(--accent);
            }

            .submit-btn {
            background: linear-gradient(90deg, var(--accent), var(--accent-secondary));
            color: #ffffff;
            border: none;
            padding: 16px;
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px var(--accent-glow);
            }

            .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px var(--accent-glow);
            filter: brightness(1.1);
            }

            .submit-btn:active {
            transform: translateY(0);
            }

            .submit-btn.success {
            background: linear-gradient(90deg, var(--green) 0%, #1f9c3d 100%);
            box-shadow: 0 4px 20px rgba(48, 209, 88, 0.4);
            }

            .submit-btn.success:hover {
            transform: translateY(0);
            box-shadow: 0 4px 20px rgba(48, 209, 88, 0.4);
            filter: none;
            }
        </style>
    </head>
    <body>
        <div class="ambient-bg">
            <div class="ambient-orb"></div>
            <div class="ambient-orb"></div>
            <div class="ambient-orb"></div>
            <div class="ambient-orb"></div>
        </div>
        <div class="noise-overlay"></div>
        <header class="glass" id="header">
            <a href="index.html" class="logo">
                <div class="logo-icon">L</div>
                <div class="logo-text">LUMIT <span>Trade</span></div>
            </a>
            <nav class="nav-menu">
                <a href="index.html" class="nav-link">На главную</a>
                <a href="profile.html" class="nav-link profile-link">
                    <svg class="profile-icon" viewBox="0 0 24 24" fill="none" xmlns="http://w3.org">
                        <path d="M20 21C20 19.6044 20 18.9067 19.7578 18.3578C19.4322 17.6194 18.8413 17.0285 18.1029 16.7029C17.554 16.4607 16.8562 16.4607 15.4607 16.4607H8.53934C7.14378 16.4607 6.446 16.4607 5.89711 16.7029C5.15873 17.0285 4.56779 17.6194 4.24221 18.3578C4 18.9067 4 19.6044 4 21M16.5 7.5C16.5 9.98528 14.4853 12.0 12 12.0C9.51472 12.0 7.5 9.98528 7.5 7.5C7.5 5.01472 9.51472 3.0 12 3.0C14.4853 3.0 16.5 5.01472 16.5 7.5Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                <span>Профиль</span>
                </a>
            </nav>
        </header>
        <div class="support">
            <h1>Техподдержка</h1>
            <p>Если у вас возникла проблема, вы можете ознакомится с <a href="index.html" class="frequently-asked-questions">часто задаваемыми вопросами</a> или заполнить форму ниже</p>
            <form class="support-form glass" onsubmit="handleSubmit(event)">
                <div class="input-group">
                    <input type="text" id="userName" required placeholder=" ">
                    <label for="userName">Ваше имя</label>
                </div>
                <div class="input-group">
                    <input type="email" id="userEmail" required placeholder=" ">
                    <label for="userEmail">Электронная почта</label>
                </div>
                <div class="input-group">
                    <textarea id="userMessage" required placeholder=" " rows="4"></textarea>
                    <label for="userMessage">Опишите вашу проблему</label>
                </div>
                <button type="submit" class="submit-btn">
                    <span>Отправить</span>
                </button>
            </form>
        </div>
        <script>
            function handleSubmit(event) {
                event.preventDefault();
                const name = document.getElementById('userName').value;
                const email = document.getElementById('userEmail').value;
                const message = document.getElementById('userMessage').value;
                console.log('Данные к отправке:', name, email, message); 
                const form = event.target;
                const btn = form.querySelector('.submit-btn');
                const btnText = btn.querySelector('span');
                const originalText = btnText.innerText;
                btnText.innerText = 'Отправлено!';
                btn.classList.add('success');
                form.reset(); 
                setTimeout(() => {
                    btnText.innerText = originalText;
                    btn.classList.remove('success');
                }, 3000);
            }
        </script>
    </body>
</html>
